<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>从排队到收口：状态、触发者与异常出口 · DSH</title><style>html,body{margin:0;background:#0b1020}body{position:relative}main{max-width:1680px;margin:auto}svg{display:block;width:100%;height:auto}.toolbar{position:absolute;right:40px;top:32px;z-index:1}button{font:15px "Segoe UI","Microsoft YaHei",sans-serif;color:#c5fff1;background:#173b40;border:1px solid #397c78;border-radius:9px;padding:12px 18px;cursor:pointer}button:focus-visible{outline:3px solid #73d8cb;outline-offset:3px}button:disabled{opacity:.6}.capture .toolbar{display:none}@media(max-width:760px){.toolbar{position:relative;top:auto;right:auto;text-align:right;padding:12px}}@media print{.toolbar{display:none}}</style></head><body><div class="toolbar"><button id="export" type="button">导出 PNG（3×）</button></div><main><svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1680" height="1190" viewBox="0 0 1680 1190" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">从排队到收口：状态、触发者与异常出口</title><desc id="diagram-desc">正常路径按级推进；worker 交活、judge 独立判、owner 收口，组成双筛。</desc><defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#e7edf9} .muted{fill:#99aac5} .tiny{font-size:16px} .small{font-size:18px} .body{font-size:20px} .title{font-size:24px;font-weight:650} .mono{font-family:Consolas,"Microsoft YaHei",monospace} .node{fill:#121d33;stroke:#334665;stroke-width:1.5} .wire{fill:none;stroke:#73d8cb;stroke-width:2.5} .optional{stroke:#8998d7;stroke-dasharray:8 7} .amber{fill:#ffc675} .amberline{stroke:#e9b765;fill:none;stroke-width:2.5}</style><radialGradient id="halo"><stop stop-color="#19314b" stop-opacity=".65"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#73d8cb"/></marker><marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e9b765"/></marker></defs><rect width="1680" height="1190" fill="#0b1020"/><text x="56" y="53" class="tiny muted" text-anchor="start" >DSH / SUBAGENT LITE2 · 工单生命周期</text><text x="56" y="110" class="" text-anchor="start" font-size="40" font-weight="700">从排队到收口：状态、触发者与异常出口</text><text x="56" y="153" class="body muted" text-anchor="start" >正常路径按级推进；worker 交活、judge 独立判、owner 收口，组成双筛。</text><rect x="260" y="213" width="340" height="105" rx="12" fill="#111d31" stroke="#334665" /><text x="276" y="239" class="small" text-anchor="start" >01  owner / tick · 派活</text><text x="276" y="270" class="small mono" text-anchor="start" >sa_advance running / 派单</text><text x="276" y="297" class="tiny muted" text-anchor="start" >按 kind 选择已登记 worker</text><rect x="670" y="213" width="340" height="105" rx="12" fill="#111d31" stroke="#334665" /><text x="686" y="239" class="small" text-anchor="start" >02  worker · 完成交活</text><text x="686" y="270" class="small mono" text-anchor="start" >sa_report {final:true}</text><text x="686" y="297" class="tiny muted" text-anchor="start" >日志：ready(worker-final)</text><rect x="1080" y="213" width="340" height="105" rx="12" fill="#111d31" stroke="#334665" /><text x="1096" y="239" class="small" text-anchor="start" >03  owner · 收口</text><text x="1096" y="270" class="small mono" text-anchor="start" >sa_advance done</text><text x="1096" y="297" class="tiny muted" text-anchor="start" >通常先有 judge 的 pass 判词</text><g class="state" data-state="queued"><rect x="80" y="350" width="290" height="150" rx="20" fill="#142337" stroke="#54758c" /><text x="102" y="380" class="small muted" text-anchor="start" >01 / 排队</text><text x="102" y="427" class="" text-anchor="start" font-size="32" font-weight="700" style="font-family:Consolas,monospace">queued</text><text x="102" y="470" class="tiny muted" text-anchor="start" >等待派活</text></g><g class="state" data-state="running"><rect x="490" y="350" width="290" height="150" rx="20" fill="#142337" stroke="#54758c" /><text x="512" y="380" class="small muted" text-anchor="start" >02 / 执行中</text><text x="512" y="427" class="" text-anchor="start" font-size="32" font-weight="700" style="font-family:Consolas,monospace">running</text><text x="512" y="470" class="tiny muted" text-anchor="start" >worker 做 + 交证据</text></g><g class="state" data-state="ready"><rect x="900" y="350" width="290" height="150" rx="20" fill="#142337" stroke="#54758c" /><text x="922" y="380" class="small muted" text-anchor="start" >03 / 待审 / 待收口</text><text x="922" y="427" class="" text-anchor="start" font-size="32" font-weight="700" style="font-family:Consolas,monospace">ready</text><text x="922" y="470" class="tiny muted" text-anchor="start" >judge 独立判，owner 决策</text></g><g class="state" data-state="done"><rect x="1310" y="350" width="290" height="150" rx="20" fill="#142337" stroke="#54758c" /><text x="1332" y="380" class="small muted" text-anchor="start" >04 / 已收口</text><text x="1332" y="427" class="" text-anchor="start" font-size="32" font-weight="700" style="font-family:Consolas,monospace">done</text><text x="1332" y="470" class="tiny muted" text-anchor="start" >完成或放弃后的收口终态</text></g><path d="M370 425 H490" class="wire" marker-end="url(#arrow)"/><path d="M780 425 H900" class="wire" marker-end="url(#arrow)"/><path d="M1190 425 H1310" class="wire" marker-end="url(#arrow)"/><path d="M225 500 V635" class="amberline" /><path d="M635 500 V635" class="amberline" /><path d="M1045 500 V635" class="amberline" /><path d="M225 635 H1045 M840 635 V770" class="amberline" marker-end="url(#amber-arrow)"/><rect x="405" y="542" width="790" height="70" rx="12" fill="#191e2c" stroke="#66533a" /><text x="800" y="568" class="small amber" text-anchor="middle" >任意态 → blocked＊：owner 处置 / judge 的 sa_verdict fail</text><text x="800" y="596" class="tiny muted" text-anchor="middle" >tick：running 超时后 staleMisses 连续 2 次无变更（默认） / 派单失败</text><path d="M650 835 H44 V425 H80" class="wire" marker-end="url(#arrow)"/><path d="M1030 835 H1636 V425 H1600" class="wire" marker-end="url(#arrow)"/><rect x="85" y="726" width="490" height="84" rx="12" fill="#111d31" stroke="#365b68" /><text x="105" y="754" class="body" text-anchor="start" >复活 → queued</text><text x="105" y="783" class="tiny muted" text-anchor="start" >owner：sa_advance queued / 内核：auto-rework</text><rect x="1115" y="726" width="470" height="84" rx="12" fill="#111d31" stroke="#365b68" /><text x="1135" y="754" class="body" text-anchor="start" >放弃收口 → done</text><text x="1135" y="783" class="tiny muted" text-anchor="start" >仅 owner：sa_advance done（blocked 的出口）</text><g class="state" data-state="blocked"><rect x="650" y="770" width="380" height="140" rx="20" fill="#2a2430" stroke="#e9b765" /><text x="840" y="815" class="" text-anchor="middle" font-size="32" font-weight="700" style="font-family:Consolas,monospace">blocked</text><text x="840" y="851" class="body amber" text-anchor="middle" >阻塞 / 待处置</text><text x="840" y="886" class="tiny muted" text-anchor="middle" >默认 judge fail 后自动复活 1 次</text></g><text x="80" y="950" class="small amber" text-anchor="start" >＊任意态的范围：queued / running / ready。代码 NEXT.done = []，done 为终态，不能回退 blocked。</text><text x="80" y="981" class="small muted" text-anchor="start" >判词不等于收口：judge 的 sa_verdict pass 保持 / 进入 ready；ready → done 由 owner 执行。</text><rect x="80" y="1012" width="480" height="76" rx="12" fill="#101b2d" stroke="#293c56" /><text x="98" y="1042" class="body" text-anchor="start" >owner · 决策 / 收口</text><text x="98" y="1071" class="tiny muted" text-anchor="start" >建单、派活、阻塞处置、复活与收口</text><rect x="600" y="1012" width="480" height="76" rx="12" fill="#101b2d" stroke="#293c56" /><text x="618" y="1042" class="body" text-anchor="start" >worker · 做 + 交证据</text><text x="618" y="1071" class="tiny muted" text-anchor="start" >sa_attach 登记产物，sa_report 自报</text><rect x="1120" y="1012" width="480" height="76" rx="12" fill="#101b2d" stroke="#293c56" /><text x="1138" y="1042" class="body" text-anchor="start" >judge · 独立判</text><text x="1138" y="1071" class="tiny muted" text-anchor="start" >sa_verdict pass / fail，给出判词</text><rect x="80" y="1110" width="1520" height="52" rx="12" fill="#291f2b" stroke="#7a4b58" /><text x="104" y="1143" class="body amber" text-anchor="start" >不可跳级</text><text x="280" y="1143" class="body mono" text-anchor="start" >queued → done 会被内核拒绝：illegal: queued -&gt; done</text></svg></main><script>const meta={locale:"zh-CN"};
const button=document.getElementById('export');
if(new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');
window.exportPNG=async function(download=true){
 const previous=button.textContent; button.disabled=true; button.textContent='正在生成…';
 let url;
 try{
  await document.fonts.ready;
  const source=document.getElementById('diagram').cloneNode(true);
  const width=Number(source.getAttribute('width')),height=Number(source.getAttribute('height'));
  source.setAttribute('xmlns','http://www.w3.org/2000/svg');
  url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(source)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();img.src=url; await img.decode();
  const canvas=document.createElement('canvas');canvas.width=width*3;canvas.height=height*3;
  const ctx=canvas.getContext('2d');ctx.scale(3,3);ctx.drawImage(img,0,0,width,height);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 编码失败')),'image/png'));
  if(download){const link=document.createElement('a');const pngURL=URL.createObjectURL(blob);link.href=pngURL;link.download='state-machine'+'@3x.png';link.click();setTimeout(()=>URL.revokeObjectURL(pngURL),1000);}
  return {type:blob.type,width:canvas.width,height:canvas.height,bytes:blob.size};
 }catch(error){button.textContent='导出失败，请重试';throw error;}
 finally{if(url)URL.revokeObjectURL(url);button.disabled=false;if(button.textContent==='正在生成…')button.textContent=previous;}
};
button.addEventListener('click',()=>window.exportPNG().catch(console.error));</script></body></html>
