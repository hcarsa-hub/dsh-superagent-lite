<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-plugin-superagent-lite · 内核发散图</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a30; --ink:#e8eeff; --dim:#9fb0d0; --line:#3a4a72;
    --core:#2fd2a6; --role:#5aa9ff; --store:#b48cff; --opt:#ffb454; --ext:#8aa0c6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 50% 40%,#101a33 0%,#080d1a 70%);
       color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 30px 6px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  h1 small{display:block;font-size:12.5px;color:var(--dim);font-weight:400;margin-top:6px;letter-spacing:0}
  .actions{display:flex;gap:10px;align-items:center}
  button{background:#1b2742;color:var(--ink);border:1px solid #2f3f66;border-radius:9px;
         padding:8px 14px;font-size:13px;cursor:pointer}
  button:hover{background:#243354}
  .hint{font-size:12px;color:var(--dim)}
  main{display:flex;justify-content:center;padding:4px 16px 24px}
  svg{width:100%;max-width:1500px;height:auto;display:block}
  text{font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  .edge{fill:none;stroke:var(--line);stroke-width:1.6}
  .edge.opt{stroke-dasharray:6 5}
  .edge.hot{stroke:#2fd2a6;stroke-width:2}
  .chip rect{fill:#0e1730;stroke:#31436b}
  .chip text{font-size:11.5px;fill:#c8d6f2}
  footer{padding:0 30px 26px;color:var(--dim);font-size:12.5px;line-height:1.7}
  footer b{color:#dfe8ff}
</style>
</head>
<body>
<header>
  <h1>dsh-plugin-superagent-lite · 内核发散图
    <small>中心 = 工单内核（31 个 sa_* 工具 / 状态机）；一圈 = 协作方与落盘；虚线 = 可选配套（缺了只是降级）</small>
  </h1>
  <div class="actions">
    <span class="hint" id="hint">导出为 3× 无损 PNG</span>
    <button id="dl">导出 PNG（3×）</button>
  </div>
</header>
<main><svg id="svg" viewBox="0 0 1560 1180" xmlns="http://www.w3.org/2000/svg"></svg></main>
<footer>
  <b>读法：</b>所有连线都从内核出发 —— 它只做「工单状态机 + 派活 + 收证据 + 送审」，不实现子代理、不调模型、不写宿主配置。
  实线是必需协作（宿主会话 / tick / 落盘），虚线是可选配套（面板、watcher、监控、外部入单）。
</footer>
<script>
const NS='http://www.w3.org/2000/svg';
const CX=780, CY=560, RX=566, RY=436;      // 椭圆轨道，容纳 11 个节点
const NODES=[
  {id:'owner',   a:-90, kind:'role',  t:'Owner 会话',      s:['决策 / 派单 / 收口','sa_submit·sa_fanout·sa_advance'], edge:'建单 / 派单',  solid:true, hot:true},
  {id:'workers', a:-57, kind:'role',  t:'Worker 会话',     s:['coder_1..4 [code] · test_1 [test]','sa_tell·sa_run · sa_report'], edge:'派活 ⇄ 自报', solid:true},
  {id:'judges',  a:-24, kind:'role',  t:'Judge 会话',      s:['judge_1 主判 · judge_2 备份','autoJudge → sa_verdict'], edge:'送审 ⇄ 判词', solid:true},
  {id:'tick',    a:9,   kind:'core2', t:'tick 引擎',       s:['每 15s 扫一遍','自动派单（按 kind）· 超时判定'], edge:'派单 / 超时', solid:true},
  {id:'state',   a:42,  kind:'store', t:'state.json',      s:['工单 + outbox','原子写 tmp→rename'], edge:'原子写', solid:true},
  {id:'evid',    a:75,  kind:'store', t:'evidence/ · archive/', s:['产物 + manifest + 判词','sa_attach / sa_evidence'], edge:'sa_attach', solid:true},
  {id:'log',     a:108, kind:'store', t:'lite.log · watchdog.json', s:['逐行追加的审计日志','巡检基线与 lastSeen'], edge:'lite.log', solid:true},
  {id:'panel',   a:141, kind:'opt',   t:'面板 panel（可选）', s:['工单 / 归档 / 判词 / 设置','读 state · 写 commands/'], edge:'读单 / 写命令', solid:false},
  {id:'watch',   a:174, kind:'opt',   t:'handoff-watch3（可选）', s:['Codex 桥 → 行首锚定','→ schedule 投递'], edge:'schedule 投递', solid:false},
  {id:'monitor', a:207, kind:'opt',   t:'ctx-monitor（可选）', s:['扫 subagent/** 水位','越线 → ingress 建单'], edge:'越线建单', solid:false},
  {id:'qq',      a:240, kind:'ext',   t:'QQ / 定时（可选）', s:['ingress 外部事件','按 key 去重后建单'], edge:'ingress 建单', solid:false},
];
const CORE={w:280,h:132};
const NW=252, NH=86;
const el=(n,attrs={})=>{const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;};
const svg=document.getElementById('svg');
const defs=el('defs');
defs.innerHTML='<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">'+
  '<feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
  '<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
  '<path d="M0,0 L10,5 L0,10 z" fill="#5f7398"/></marker>';
svg.appendChild(defs);
const gLines=el('g'); svg.appendChild(gLines);
const gLen=el('g');   svg.appendChild(gLen);
const gBox=el('g');   svg.appendChild(gBox);
const pts={};
for(const n of NODES){
  const r=n.a*Math.PI/180;
  pts[n.id]={x:CX+RX*Math.cos(r), y:CY+RY*Math.sin(r)};
}
// 连线：从内核边缘到节点边缘的二次曲线
for(const n of NODES){
  const p=pts[n.id];
  const dx=p.x-CX, dy=p.y-CY, d=Math.hypot(dx,dy)||1;
  const sx=CX+dx/d*CORE.w/2*0.92, sy=CY+dy/d*CORE.h/2*0.92;
  const ex=p.x-dx/d*(NW/2)*0.86,  ey=p.y-dy/d*(NH/2)*0.86;
  const mx=(sx+ex)/2, my=(sy+ey)/2;
  const nx=-dy/d, ny=dx/d;                       // 法向，让连线略弯，避免全部笔直扎堆
  const bend = 26;
  const cx=mx+nx*bend, cy=my+ny*bend;
  const path=el('path',{d:`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`,class:'edge'+(n.solid?'':' opt')+(n.hot?' hot':'')});
  path.setAttribute('marker-end','url(#arw)');
  gLines.appendChild(path);
  // 标签 chip 放在曲线 60% 处
  const tt=0.6, bx=(1-tt)*(1-tt)*sx+2*(1-tt)*tt*cx+tt*tt*ex, by=(1-tt)*(1-tt)*sy+2*(1-tt)*tt*cy+tt*tt*ey;
  const tw=Math.max(56, n.edge.length*12.2+18), th=22;
  const chip=el('g',{class:'chip'});
  chip.appendChild(el('rect',{x:bx-tw/2,y:by-th/2,width:tw,height:th,rx:11}));
  const txt=el('text',{x:bx,y:by+4,'text-anchor':'middle'});
  txt.textContent=n.edge;
  chip.appendChild(txt);
  gLen.appendChild(chip);
}
// 节点
const PALETTE={role:'#5aa9ff',core2:'#2fd2a6',store:'#b48cff',opt:'#ffb454',ext:'#8aa0c6'};
for(const n of NODES){
  const p=pts[n.id], x=p.x-NW/2, y=p.y-NH/2, col=PALETTE[n.kind];
  const g=el('g');
  g.appendChild(el('rect',{x,y,width:NW,height:NH,rx:14,fill:'#111a2e',stroke:col,'stroke-width':1.7,
    'stroke-dasharray':n.solid?'':'6 5','fill-opacity':0.95}));
  g.appendChild(el('rect',{x,y,width:5,height:NH,rx:2.5,fill:col}));
  const t=el('text',{x:x+18,y:y+29,fill:'#eaf1ff','font-size':16.5,'font-weight':600}); t.textContent=n.t; g.appendChild(t);
  n.s.forEach((line,i)=>{const s=el('text',{x:x+18,y:y+52+i*18,fill:'#9fb0d0','font-size':12.5}); s.textContent=line; g.appendChild(s);});
  gBox.appendChild(g);
}
// 中心内核
const hub=el('g',{filter:'url(#glow)'});
hub.appendChild(el('rect',{x:CX-CORE.w/2,y:CY-CORE.h/2,width:CORE.w,height:CORE.h,rx:20,fill:'#0f2a26',stroke:'#2fd2a6','stroke-width':2.4}));
hub.appendChild(el('rect',{x:CX-CORE.w/2,y:CY-CORE.h/2,width:CORE.w,height:6,rx:3,fill:'#2fd2a6'}));
const t1=el('text',{x:CX,y:CY-26,'text-anchor':'middle',fill:'#dffff6','font-size':21,'font-weight':700}); t1.textContent='工单内核';
const t2=el('text',{x:CX,y:CY+2,'text-anchor':'middle',fill:'#7ff0d0','font-size':13.5}); t2.textContent='31 个 sa_* 工具 · 状态机';
const t3=el('text',{x:CX,y:CY+26,'text-anchor':'middle',fill:'#9fb0d0','font-size':12.5}); t3.textContent='queued → running → ready → done';
const t4=el('text',{x:CX,y:CY+48,'text-anchor':'middle',fill:'#9fb0d0','font-size':12}); t4.textContent='零第三方依赖 · 不内嵌模型';
[ t1,t2,t3,t4 ].forEach(t=>hub.appendChild(t));
gBox.appendChild(hub);
// 图例
const leg=el('g');
const items=[['#2fd2a6','内核'],['#5aa9ff','角色会话'],['#b48cff','落盘 / 证据'],['#ffb454','可选配套'],['#8aa0c6','外部入单']];
let lx=60;
items.forEach(([c,label])=>{
  leg.appendChild(el('rect',{x:lx,y:1124,width:14,height:14,rx:4,fill:c}));
  const tt=el('text',{x:lx+22,y:1136,fill:'#9fb0d0','font-size':13}); tt.textContent=label; leg.appendChild(tt);
  lx+=Math.max(92,label.length*15+58);
});
const note=el('text',{x:1560-60,y:1136,'text-anchor':'end',fill:'#6e7f9e','font-size':12.5});
note.textContent='实线 = 必需协作　虚线 = 可选配套（面板 / watcher / 监控 / QQ）';
leg.appendChild(note);
svg.appendChild(leg);
// 导出 3× 无损 PNG
document.getElementById('dl').addEventListener('click',async()=>{
  const data=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const S=3, w=1560, h=1180;
    const cv=document.createElement('canvas'); cv.width=w*S; cv.height=h*S;
    const ctx=cv.getContext('2d'); ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    const a=document.createElement('a');
    a.download='dsh-plugin-superagent-lite-radial@3x.png';
    a.href=cv.toDataURL('image/png'); a.click();
    URL.revokeObjectURL(url);
  };
  img.src=url;
});
</script>
</body>
</html>
