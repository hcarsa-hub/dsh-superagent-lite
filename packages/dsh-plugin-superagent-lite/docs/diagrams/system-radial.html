l="#121c31" stroke="#365b68" /><text x="890.13" y="1175.56" class="tiny" text-anchor="start" style="fill:#73d8cb">06</text><text x="922.13" y="1182.56" class="" text-anchor="start" font-size="21" font-weight="650">evidence/ · archive/</text><text x="890.13" y="1216.56" class="small" text-anchor="start" >产物 + manifest + 判词</text><text x="890.13" y="1247.56" class="tiny muted" text-anchor="start" >证据留存 / 收口归档</text></g><g class="collaborator" data-order="7"><rect x="506.87" y="1148.56" width="300" height="124" rx="16" fill="#121c31" stroke="#365b68" /><text x="523.87" y="1175.56" class="tiny" text-anchor="start" style="fill:#73d8cb">07</text><text x="555.87" y="1182.56" class="" text-anchor="start" font-size="19" font-weight="650">lite.log · watchdog.json</text><text x="523.87" y="1216.56" class="small" text-anchor="start" >审计 / 巡检基线</text><text x="523.87" y="1247.56" class="tiny muted" text-anchor="start" >留痕与异常核对</text></g><g class="collaborator" data-order="8"><rect x="198.76" y="1002.33" width="300" height="124" rx="16" fill="#121c31" stroke="#49557e" /><text x="215.76" y="1029.33" class="tiny" text-anchor="start" style="fill:#8998d7">08</text><text x="247.76" y="1036.33" class="" text-anchor="start" font-size="24" font-weight="650">面板 panel</text><text x="215.76" y="1070.33" class="small" text-anchor="start" >可选 · 看板 / 按钮 / 归档</text><text x="215.76" y="1101.33" class="tiny muted" text-anchor="start" >共享同一 stateDir</text></g><g class="collaborator" data-order="9"><rect x="46.62" y="756.31" width="300" height="124" rx="16" fill="#121c31" stroke="#49557e" /><text x="63.62" y="783.31" class="tiny" text-anchor="start" style="fill:#8998d7">09</text><text x="95.62" y="790.31" class="" text-anchor="start" font-size="24" font-weight="650">handoff-watch3</text><text x="63.62" y="824.31" class="small" text-anchor="start" >可选 · handoff 监听</text><text x="63.62" y="855.31" class="tiny muted" text-anchor="start" >普通交接 → 会话消息</text></g><g class="collaborator" data-order="10"><rect x="98.74" y="488.6" width="300" height="124" rx="16" fill="#121c31" stroke="#49557e" /><text x="115.74" y="515.6" class="tiny" text-anchor="start" style="fill:#8998d7">10</text><text x="147.74" y="522.6" class="" text-anchor="start" font-size="24" font-weight="650">ctx-monitor</text><text x="115.74" y="556.6" class="small" text-anchor="start" >可选 · 上下文水位监测</text><text x="115.74" y="587.6" class="tiny muted" text-anchor="start" >告警 → ingress</text></g><g class="collaborator" data-order="11"><rect x="338.58" y="284.2" width="300" height="124" rx="16" fill="#121c31" stroke="#49557e" /><text x="355.58" y="311.2" class="tiny" text-anchor="start" style="fill:#8998d7">11</text><text x="387.58" y="318.2" class="" text-anchor="start" font-size="24" font-weight="650">QQ / 定时</text><text x="355.58" y="352.2" class="small" text-anchor="start" >可选 · 外部事件入口</text><text x="355.58" y="383.2" class="tiny muted" text-anchor="start" >QQ ingress / 定时触发</text></g><g class="kernel"><rect x="580" y="640" width="520" height="220" rx="24" fill="#162d40" stroke="#73d8cb" /><text x="840" y="683" class="" text-anchor="middle" font-size="32" font-weight="700">工单内核</text><text x="840" y="725" class="title" text-anchor="middle" >32 个 sa_* 工具</text><text x="840" y="767" class="body mono" text-anchor="middle" >queued → running → ready → done</text><text x="840" y="810" class="body muted" text-anchor="middle" >零第三方依赖 · 工单 / 派活 / 双筛</text></g><path d="M60 1330 H1620" class="" stroke="#29354c"/><path d="M70 1363 H134" class="wire" /><text x="148" y="1370" class="small" text-anchor="start" >实线：必需协作 / 落盘</text><path d="M490 1363 H554" class="wire optional" /><text x="568" y="1370" class="small" text-anchor="start" >虚线：可选配套</text><text x="1610" y="1370" class="small muted" text-anchor="end" >11 个协作方 · 从 01 起顺时针阅读</text><text x="70" y="1410" class="small muted" text-anchor="start" >读法：每条连线只连接内核与一个协作方；胶囊标明关系。可选配套缺失时，对应能力降级。</text></svg></main><script>const meta={locale:"zh-CN"};
const button=document.getElementById('export');
if(new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');
window.exportPNG=async function(download=true){
 const previous=button.textContent; button.disabled=true; button.textContent='正在生成…';
 let url;
 try{
  await document.fonts.ready;
  const source=document.getElementById('diagram').cloneNode(true);
  const width=Number(source.getAttribute('width')),height=Number(source.getAttribute('height'));
  source.setAttribute('xmlns','http://www.w3.org/2000/svg');
  url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(source)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();img.src=url; await img.decode();
  const canvas=document.createElement('canvas');canvas.width=width*3;canvas.height=height*3;
  const ctx=canvas.getContext('2d');ctx.scale(3,3);ctx.drawImage(img,0,0,width,height);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 编码失败')),'image/png'));
  if(download){const link=document.createElement('a');const pngURL=URL.createObjectURL(blob);link.href=pngURL;link.download='system-radial'+'@3x.png';link.click();setTimeout(()=>URL.revokeObjectURL(pngURL),1000);}
  return {type:blob.type,width:canvas.width,height:canvas.height,bytes:blob.size};
 }catch(error){button.textContent='导出失败，请重试';throw error;}
 finally{if(url)URL.revokeObjectURL(url);button.disabled=false;if(button.textContent==='正在生成…')button.textContent=previous;}
};
button.addEventListener('click',()=>window.exportPNG().catch(console.error));</script></body></html>
